schema_version: 1
options:
- id: Вар-1
  title: Оставить как есть
  kind: оставить как есть
  differs:
    axis: ценность
    from: Вар-2
    how: предупреждения о перебое и новых действий нет, остаются нынешний кабинет и просьбы близких
  main_assumption: Без изменений плановый год пройдёт на уровне ожидания, перебои не уводят семьи
  inaction_cost: 'По брифу без изменений ждут 5 000 активных групп и 279 млн руб. при цели не ниже 8 000
    групп и 285 млн руб. (У-38): цели плана недостижимы'
  objections:
  - hits_assumption: Перебои не уводят семьи, и конкуренты не отбирают клиентов
    drops_if: конкуренты быстро наращивают семейные услуги
    basis: У-23
  - hits_assumption: Клиенты терпят нынешний уровень сюрпризов
    drops_if: рост цен усиливает жалобы на счета
    basis: У-10
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект не измерен, нужен П-1 и сравнение с планом'
    cost:
      text: Новых затрат нет
    risk:
      text: Разрыв с целями брифа не закрывается (У-38)
    first_signal:
      why_empty: изменений нет, и нового сигнала нет
    reversibility:
      text: Начать пилот можно позже
      what: запустить любой из активных вариантов позже
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря времени до решения
- id: Вар-2
  title: 'Пилот для семейных групп: предупреждение организатору об остатке общего пакета и действие «добавить
    из остатка»'
  kind: активный
  differs:
    axis: аудитория
    from: Вар-3
    how: помощь организатору семейной группы, а не владельцу собственных номеров
  main_assumption: Организатор узнаёт о перебое слишком поздно, а участник согласен показывать ему остаток
    (У-37)
  objections:
  - hits_assumption: Организатор узнаёт о перебое слишком поздно
    drops_if: сигнал о состоянии счёта и номерах уже виден организатору в приложении
    basis: У-16
  - hits_assumption: Участник согласен показывать остаток организатору
    drops_if: участники массово отказывают в разрешении или отзывают его
    basis: У-7
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект предупреждений на перебои и отток не измерен, см. П-1'
    cost:
      text: Уведомление и кнопка действия в существующем приложении; трудозатраты не оценены (П-4)
    risk:
      text: Разрешение участника на остаток может не быть дано; причина перебоя может оказаться другой
        (П-2)
    first_signal:
      why_empty: 'нет базы для срока первых данных пилота: нужен П-1; уведомления позже в цикле действуют
        сильнее (У-31), но срок не оценён'
    reversibility:
      text: Уведомления можно отключить
      what: отключить уведомление и кнопку для группы
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря накопленного опыта пилота
- id: Вар-3
  title: 'Пилот для владельцев нескольких номеров: предупреждение о платеже и остатке по собственным номерам,
    например роутера'
  kind: активный
  differs:
    axis: аудитория
    from: Вар-2
    how: владелец своих номеров в одном кабинете, а не организатор группы с участниками
  main_assumption: Владелец не замечает, что деньги или интернет на номере роутера закончились
  objections:
  - hits_assumption: Владелец не замечает, что деньги закончились
    drops_if: автопополнение и лимит уже закрывают платёж по номеру
    basis: У-19
  - hits_assumption: Предупреждения уникальны
    drops_if: единый кабинет с переключением номеров уже есть у оператора
    basis: У-14
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект не измерен, а аудитория малая; см. П-1'
    cost:
      text: Уведомление по номеру без согласия участников; трудозатраты не оценены (П-4)
    risk:
      text: Услуга частично покрыта автопополнением у конкурента (У-18)
    first_signal:
      why_empty: 'нет базы для срока первых данных: см. П-1'
    reversibility:
      text: Уведомление можно отключить
      what: отключить уведомление по номеру
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря опыта пилота
- id: Вар-4
  title: Пилот для семей по разбору начислений («за что списали»)
  kind: активный
  differs:
    axis: ценность
    from: Вар-2
    how: объяснение списаний вместо предупреждения о перебое
  main_assumption: Основной ущерб семьи — непонятное списание, а не перебой
  objections:
  - hits_assumption: Участник открывает организатору начисления
    drops_if: приглашение с доступом к начислениям принимают заметно реже, чем только с остатком
    basis: У-40
  - hits_assumption: Непонимание начислений — причина недовольства
    drops_if: недовольство вызывает рост цен, а не непонятность
    basis: У-11
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: частота причин не известна, см. П-2 и П-1'
    cost:
      text: Экран с расшифровкой и отдельное согласие участника; трудозатраты не оценены (П-4)
    risk:
      text: 'Согласие на начисления нужно отдельно (У-7, бриф): охват уже'
    first_signal:
      why_empty: 'нет базы для срока первых данных: см. П-2'
    reversibility:
      text: Расшифровку можно убрать
      what: скрыть экран расшифровки
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря согласий участников
- id: Вар-5
  title: 'Сначала дешёвая проверка причины: выгрузка обращений и опрос семей, без пилота услуги'
  kind: активный
  differs:
    axis: ценность
    from: Вар-2
    how: результат — знание о причине перебоев, а не услуга клиентам
  main_assumption: Причину перебоя можно установить по обращениям быстрее и дешевле, чем в пилоте
  objections:
  - hits_assumption: Причина читается из обращений
    drops_if: обращения не отделяют пакет от неоплаты
    basis: У-39
  - hits_assumption: Проверка нужна, потому что причина неясна
    drops_if: нехватка средств уже объясняет заметную долю неудачных вызовов
    basis: У-24
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: проверка даёт знание, а не клиентский эффект; см. П-2'
    cost:
      text: Работа аналитика по выгрузке и разметке; трудозатраты не оценены (П-4)
    risk:
      text: Время уходит, а клиенты получают помощь позже
    first_signal:
      why_empty: 'нет базы для срока: зависит от доступа к данным, см. П-2'
    reversibility:
      text: Проверку можно остановить в любой момент
      what: остановить выгрузку и разметку
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря недели работы аналитика
- id: Вар-6
  title: Не запускать
  kind: не запускать
  differs:
    axis: модель дохода
    from: Вар-2
    how: нового дохода от семей и владельцев нет
  main_assumption: Новая услуга не окупится и не изменит результат плана
  return_condition: Пилот или проверка причины покажут эффект предупреждений на перебои и отток, или конкуренты
    усилят семейные услуги
  objections:
  - hits_assumption: Новая услуга не окупится
    drops_if: уведомления о нехватке средств снижают отток
    basis: У-26
  - hits_assumption: Операторы не усиливают семейные услуги
    drops_if: конкурент добавляет роли и защиту в семейных группах
    basis: У-21
  comparison:
    effect:
      why_empty: 'прогноз эффекта не нужен: изменений нет; см. П-1'
    cost:
      text: Новых затрат нет
    risk:
      text: Разрыв с целями плана (У-38) остаётся и растёт при росте семейных услуг конкурентов (У-23)
    first_signal:
      why_empty: изменений нет, и нового сигнала нет
    reversibility:
      text: Вернуться к запуску можно
      what: вернуться к пилоту после проверки
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря времени
recommendation:
  option: Вар-2
  why: 'В отличие от Вар-3, аудитория шире и автопополнение и лимит у МегаФона уже закрывают платёж по
    номерам (У-19, У-17); в отличие от Вар-4, не требует отдельного доступа к начислениям (У-7), и по
    опыту поддержки чаще жалуются на пакет (У-37); в отличие от Вар-5, пилот с контрольной группой даёт
    и эффект (П-1), и причину, а уведомления помогают оставаться в пределах пакета (У-30). Выбор условный
    по П-2: факты не различают Вар-2 и Вар-5 по причине перебоев'
  claims:
  - У-30
  - У-7
  - У-17
  - У-19
  - У-37
  strongest_objection: Организатор уже видит остаток в приложении, и новое уведомление ничего не изменит
  answer: Виджет и кабинет показывают состояние счёта по запросу (У-16), а уведомление приходит само;
    Emory показывает, что уведомления меняют поведение (У-30). Эффект на отток пилот проверит с контрольной
    группой, и при отсутствии разницы переход к Вар-5
  change_mind:
  - metric: разница в обращениях и перебоях между пилотной и контрольной группой
    threshold: снижение обращений и перебоев в пилотной группе не больше 0 % за квартал
    action: перейти к Вар-5, пилот не расширять
  - metric: прирост валовой прибыли = (активные группы пилота сверх ожидания без изменений, У-38) × прибыль
      на группу (П-4) − затраты пилота (П-4)
    threshold: ниже 0 млн руб. два квартала подряд
    action: перейти к Вар-6 (не запускать)
  - metric: доля неоплаты среди причин перебоя в выгрузке обращений (П-2)
    threshold: выше 50 % всех размеченных причин
    action: перейти к Вар-4
  loses_on: затраты
