schema_version: 1
options:
- id: Вар-1
  title: Оставить как есть
  kind: оставить как есть
  differs:
    axis: ценность
    from: Вар-2
    how: предупреждения о перебое и новых действий нет, остаются нынешний кабинет и просьбы близких
  main_assumption: Без изменений плановый год пройдёт на уровне ожидания, перебои не уводят семьи
  inaction_cost: 'По брифу без изменений ждут 5 000 активных групп и 279 млн руб. при цели не ниже 8 000
    групп и 285 млн руб. (У-38): разрыв 3 000 групп и 6 млн руб.'
  objections:
  - hits_assumption: Перебои не уводят семьи
    drops_if: среди ушедших за год групп заметно выше доля с перерасходом или исчерпанием пакета, чем
      среди оставшихся
    basis: У-32
  - hits_assumption: Ожидание 5 000 групп и 279 млн руб. держится при росте конкурентов
    drops_if: к середине года активных групп меньше линейного хода к 5 000, а у МегаФона число семейных
      групп растёт
    basis: У-23
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект не измерен, нужен П-1'
    cost:
      text: Новых затрат нет
    risk:
      text: Разрыв с целями брифа не закрывается (У-38)
    first_signal:
      why_empty: изменений нет, и нового сигнала нет
    reversibility:
      text: Начать пилот можно позже
      what: запустить любой из активных вариантов позже
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря времени до решения
- id: Вар-2
  title: 'Пилот для семейных групп: предупреждение организатору об остатке общего пакета и действие «добавить
    из остатка»'
  kind: активный
  differs:
    axis: аудитория
    from: Вар-3
    how: помощь организатору семейной группы, а не владельцу собственных номеров
  main_assumption: Организатор узнаёт о перебое слишком поздно, а участник согласен показывать ему остаток
    (У-37)
  objections:
  - hits_assumption: Исчерпание общего пакета обрывает связь и ведёт к потере семьи
    drops_if: расход сверх пакета идёт из тарифа организатора без отключения участника
    basis: У-22
  - hits_assumption: Организатор, получив предупреждение, совершит действие
    drops_if: меньше трети организаторов действуют в течение суток
    basis: У-41
  - hits_assumption: Эффект предупреждения обнаружится за квартал
    drops_if: перебоев в контрольной группе так мало, что разницу не измерить
    basis: У-42
  - hits_assumption: Участник согласен показывать остаток организатору
    drops_if: участники массово отказывают в разрешении или отзывают его
    basis: У-7
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект предупреждений на перебои и отток не измерен, см. П-1'
    cost:
      text: Уведомление и кнопка действия; затраты не оценены, см. П-4
    risk:
      text: Разрешение участника на остаток может не быть дано (У-7); причина перебоя может оказаться
        другой (П-2)
    first_signal:
      why_empty: 'нет базы для срока первых данных пилота: нужен П-1; уведомления позже в цикле действуют
        сильнее (У-31), но срок не оценён'
    reversibility:
      text: Уведомления можно отключить
      what: отключить уведомление и кнопку для группы
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря накопленного опыта пилота
- id: Вар-3
  title: 'Пилот для владельцев нескольких номеров: предупреждение о платеже и остатке по собственным номерам,
    например роутера'
  kind: активный
  differs:
    axis: аудитория
    from: Вар-2
    how: владелец своих номеров в одном кабинете, а не организатор группы с участниками
  main_assumption: Владелец не замечает, что деньги или интернет на номере роутера закончились
  objections:
  - hits_assumption: Остановка роутера по нулю баланса ведёт к оттоку
    drops_if: больше 90 % владельцев пополняют номер роутера в течение суток после остановки
    basis: У-43
  - hits_assumption: Предупреждения уникальны
    drops_if: единый кабинет с переключением номеров уже есть у оператора
    basis: У-14
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: эффект и размер аудитории не известны, см. П-1'
    cost:
      text: Уведомление по номеру без согласия участников; затраты не оценены, см. П-4
    risk:
      text: Пополнение раз в 30 дней у МегаФона (У-18) пересекается по теме, покрытие услуги не установлено
    first_signal:
      why_empty: 'нет базы для срока первых данных: см. П-1'
    reversibility:
      text: Уведомление можно отключить
      what: отключить уведомление по номеру
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря опыта пилота
- id: Вар-4
  title: Пилот для семей по разбору начислений («за что списали»)
  kind: активный
  differs:
    axis: ценность
    from: Вар-2
    how: объяснение списаний вместо предупреждения о перебое
  main_assumption: Основной ущерб семьи — непонятное списание, а не перебой
  objections:
  - hits_assumption: Участник открывает организатору начисления
    drops_if: приглашение с доступом к начислениям принимают заметно реже, чем только с остатком
    basis: У-40
  - hits_assumption: Расшифровка снимает недовольство
    drops_if: после показа расшифровки доля обращений по счёту у пилотной группы не ниже контрольной
    basis: У-44
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: частота причин не известна, см. П-2 и П-1'
    cost:
      text: Экран с расшифровкой и отдельное согласие участника; затраты не оценены, см. П-4
    risk:
      text: 'Согласие на начисления нужно отдельно (бриф): охват уже; Verizon запрашивает разрешение участника
        на показ данных (У-7)'
    first_signal:
      why_empty: 'нет базы для срока первых данных: см. П-2'
    reversibility:
      text: Расшифровку можно убрать
      what: скрыть экран расшифровки
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря согласий участников
- id: Вар-5
  title: 'Сначала дешёвая проверка причины: выгрузка обращений и опрос семей, без пилота услуги'
  kind: активный
  differs:
    axis: ценность
    from: Вар-2
    how: результат — знание о причине перебоев, а не услуга клиентам
  main_assumption: Причину перебоя можно установить по обращениям быстрее и дешевле, чем в пилоте
  objections:
  - hits_assumption: Проверка быстрее и дешевле пилота
    drops_if: разметка сотни обращений занимает больше времени, чем настройка пилота
    basis: У-45
  - hits_assumption: После проверки причины решение можно принять без пилота
    drops_if: после выгрузки всё равно нужен пилот с контрольной группой, потому что эффект П-1 по обращениям
      не определяется
    basis: У-46
  comparison:
    effect:
      why_empty: 'нет базы для диапазона: проверка даёт знание, а не клиентский эффект; см. П-2'
    cost:
      text: Работа аналитика по выгрузке и разметке; срок и затраты не оценены, см. П-4
    risk:
      text: Клиенты получают помощь позже; причина может не читаться из записей (У-39)
    first_signal:
      why_empty: 'нет базы для срока: зависит от доступа к данным, см. П-2'
    reversibility:
      text: Проверку можно остановить в любой момент
      what: остановить выгрузку и разметку
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря времени аналитика
- id: Вар-6
  title: Не запускать
  kind: не запускать
  differs:
    axis: ценность
    from: Вар-2
    how: клиентам нового не предлагается
  main_assumption: Новая услуга не окупится и не изменит результат плана
  return_condition: Проверка причины или пилот покажут эффект предупреждений на перебои и отток, или конкуренты
    усилят семейные услуги
  objections:
  - hits_assumption: Новая услуга не окупится
    drops_if: оценка валовой прибыли пилота по П-4 выше недостающих 6 млн руб. (285 − 279, У-38) или предупреждения
      снижают отток
    basis: У-26
  - hits_assumption: Операторы не усиливают семейные услуги
    drops_if: число МегаСемей у МегаФона растёт и дальше при росте функций контроля расходов
    basis: У-23
  comparison:
    effect:
      why_empty: 'прогноз эффекта не нужен: изменений нет; см. П-1'
    cost:
      text: Новых затрат нет
    risk:
      text: Разрыв с целями плана (У-38) остаётся при росте семейных услуг конкурентов (У-23)
    first_signal:
      why_empty: изменений нет, и нового сигнала нет
    reversibility:
      text: Вернуться к запуску можно
      what: вернуться к пилоту после проверки
      time: 'не оценён: нет данных о трудозатратах, П-4'
      price: потеря времени
recommendation:
  option: Вар-5
  why: 'Выбор условный: факты не различают Вар-2, Вар-3 и Вар-4 по эффекту, потому что открытые данные
    дают жалобы на счета и услуги (У-9), а не причины перебоя групп, и измеренного эффекта предупреждений
    на отток нет (П-1). Вар-5 выбран как первый шаг: только он закрывает П-2 (около 15 минут по gaps.yaml),
    от которого зависит выбор между Вар-2 и Вар-4, и не опирается на согласие участника (У-7); допущение
    руководителя про пакет (У-37) проверяется выгрузкой, а не принимается как факт'
  claims:
  - У-9
  - У-7
  - У-30
  - У-37
  - У-39
  strongest_objection: После выгрузки всё равно нужен пилот с контрольной группой, и проверка только отодвигает
    его
  answer: 'Да, Вар-5 не заменяет пилот, а выбирает его вид: по выгрузке решается, пилот про общий пакет
    (Вар-2) или про начисления (Вар-4); эффект предупреждений (У-30 про поведение, не про отток) всё равно
    измеряется в пилоте с контрольной группой. Если разметка не читает причину (У-39), сразу идти к Вар-2
    с оценкой частоты перебоев до пилота (У-42)'
  change_mind:
  - metric: доля исчерпания общего пакета среди размеченных причин перебоя в выгрузке (П-2)
    threshold: выше 50 % всех размеченных причин
    action: 'перейти к Вар-2: пилот с контрольной группой'
  - metric: доля неоплаты и непонятных списаний среди размеченных причин (П-2)
    threshold: выше 50 % всех размеченных причин
    action: перейти к Вар-4
  - metric: ожидаемый прирост валовой прибыли пилота = группы пилота (П-4) × прибыль на группу (П-4) −
      затраты (П-4)
    threshold: ниже 6 млн руб. (285 − 279, У-38)
    action: перейти к Вар-6 (не запускать)
  loses_on: эффект
chosen: Вар-2
