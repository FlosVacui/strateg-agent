schema_version: 1
questions:
- id: ВП-1
  text: Какие причины перебоя связи и неприятных сюрпризов (исчерпание пакета, неоплата, непонятное списание)
    чаще всего встречаются в открытых данных об абонентах семейных тарифов и нескольких номеров
  impact: высокое
  branches:
  - if: чаще всего перебой из-за исчерпания пакета у участника группы
    then: 'пилот для семейных групп: предупреждение об остатке и действие организатора'
  - if: чаще всего перебой из-за неоплаты или непонятных списаний
    then: пилот про платёж или разбор начислений, а не про общий пакет
  close_cost:
    usd: 0.5
    minutes: 6.0
  where: отчёты операторов и регуляторов об обращениях абонентов, отраслевые обзоры, исследования потребителей
  status: открыт
- id: ВП-2
  text: 'Что для семейных групп и нескольких номеров операторы уже дают бесплатно или за плату: уведомления
    об остатке, докупка пакета организатором, контроль расходов, единый кабинет'
  impact: высокое
  branches:
  - if: близкие по смыслу уведомления и докупка уже есть у операторов без платы
    then: 'выбрать самый простой вариант: сигнал в существующем приложении со ссылкой на действие'
  - if: готового предупреждения у операторов нет
    then: рассматривать новый кабинет или отдельную услугу
  close_cost:
    usd: 0.5
    minutes: 6.0
  where: страницы условий и справки операторов по семейным тарифам и контролю расходов
  status: открыт
- id: ВП-3
  text: Есть ли открытые данные о том, что предупреждения об остатке или платеже снижают перебои и отток
    абонентов
  impact: высокое
  branches:
  - if: есть свидетельства снижения оттока или ограничений связи от предупреждений
    then: одобрить пилот и взять эффект из свидетельств как основу диапазона
  - if: свидетельств нет или эффект слабый
    then: сначала дешёвая проверка причины, пилот не расширять
  close_cost:
    usd: 0.5
    minutes: 6.0
  where: исследования удержания в телекоме, отчёты операторов, статьи об уведомлениях о балансе
  status: открыт
- id: ВП-4
  text: Какие условия согласия и видимости данных участника для организатора группы действуют у операторов
    и в открытых правилах защиты данных
  impact: среднее
  branches:
  - if: остаток общего пакета можно показывать организатору при согласии участника
    then: строить путь клиента на согласии участника только на остаток, начисления открывать отдельно
  - if: для остатка нужно отдельное согласие и ограничения шире
    then: сузить пилот до сведений, которые оператор вправе показывать без нового согласия, и заложить
      срок на проверку согласий
  close_cost:
    usd: 0.4
    minutes: 5.0
  where: условия оферт и справка операторов, открытые правила обработки персональных данных
  status: открыт
excluded:
- text: Как называются реальные операторы-конкуренты и их доли рынка
  reason: рынок учебный и вымышленный, доли и названия не меняют ни одного действия
- text: Точная стоимость разработки
  reason: 'неизвестна и вне рамки: расчёт даст предельную сумму вложений, а не поиск'
estimate:
  usd: 5.0
  minutes: 30.0
