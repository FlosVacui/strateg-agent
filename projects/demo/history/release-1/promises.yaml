schema_version: 1
promises:
- id: О-1
  text: Предупредим организатора, когда общий пакет группы подходит к концу
  capability: 'услуги ещё нет, документации продукта нет: это предмет пилота'
  claims: []
  conditions: нужно разрешение участника на показ остатка; срок предупреждения не оценён
  status: не подтверждено
- id: О-2
  text: Интернет участнику можно добавить из свободного остатка
  capability: действие организатора, описанное в брифе учебного оператора
  claims:
  - У-50
  conditions: тариф разрешает операцию, организатор вправе распределять пакет, свободного объёма хватает
    (бриф, стр. 5); страница справки по тарифам не открылась (И-2)
  status: подтверждено
- id: О-3
  text: Остаток пакета видят только с вашего разрешения, и вы можете отозвать его в любой момент
  capability: правило согласия участника, описанное в брифе учебного оператора
  claims:
  - У-51
  conditions: разрешение касается только остатка интернета, для начислений нужен отдельный доступ (бриф,
    стр. 5)
  status: подтверждено
- id: О-4
  text: С предупреждением перебоев связи в группе станет меньше
  capability: независимого измерения эффекта нет, пилот его только проверит
  claims: []
  conditions: нет данных, П-1
  status: не подтверждено
