schema_version: 1
version: 1
decision:
  value: к концу первого квартала — какой первой проблеме и группе клиентов посвятить пилот и выделять
    ли на него людей и деньги; к концу второго — расширять охват, менять предложение или продолжать наблюдение
  origin: ответ человека
decision_space:
- 'пилот для семейных групп: предупреждение о перебое общего пакета и действие по нему'
- 'пилот для владельцев нескольких номеров: предупреждение о платеже или остатке по собственным номерам,
  например роутера'
- пилот для семей по разбору начислений («за что списали»)
- сначала дешёвая проверка одной причины проблемы, без полноценного пилота
- сохранить нынешнее обслуживание и продолжить наблюдение
deadline:
  value: решение о пилоте — к концу первого квартала; решение о расширении, изменении предложения или
    наблюдении — к концу второго квартала
  origin: из материалов
  source: И-1
research_question:
  value: у каких клиентов и в какой момент перебой связи или непонятное списание наносят наибольший ущерб,
    когда оператор ещё может помочь и какая первая услуга даст пользу клиенту и валовую прибыль оператору
  origin: допущение
recipient:
  value: руководитель направления (ответственный уже определён), с участием финансовой команды на втором
    решении
  origin: из материалов
  source: И-1
constraints:
  value: 'учебные числа брифа; ресурсы: дизайнер и аналитик по половине ставки (не выделены), три человеко-месяца
    разработчиков на второй квартал (предварительно), один человеко-месяц тестирования не подтверждён;
    нужен отдельный документ из пяти частей; только открытые источники и материалы пользователя'
  origin: из материалов
  source: И-1
data:
  value: бриф с рынком и показателями учебного оператора (И-1); страница справки по семейным тарифам по
    ссылке из запроса не открылась, её содержание в рамку не входит
  origin: из материалов
  source: И-1
region:
  value: вымышленный учебный рынок; реальный регион не задан
  origin: допущение
success_criteria:
  value: 'план на год и измеримый ориентир на конец третьего года; цели планового года не ниже: валовая
    прибыль 285 млн руб., 8 000 активных семейных групп, 12 000 подключённых групп, 2 000 подключённых
    владельцев, 60 % активации за 14 дней; для недостижимых целей показан разрыв и цена его устранения;
    пилот с проверяемой пользой для клиента и порогом решения'
  origin: из материалов
  source: И-1
out_of_scope:
  value: реальные данные настоящих операторов и персональные данные клиентов; определение местоположения
    участника и совместная подписка с партнёром как первая услуга (допускаются только как отдельная проверка);
    фактические расчёты стоимости разработки, пока она неизвестна
  origin: допущение
