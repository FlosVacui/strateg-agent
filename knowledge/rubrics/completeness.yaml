# Рубрика полноты выхода. Её читает критик на шаге 6 вместе с файлами проекта.
# Правила кейса здесь не повторяются: рубрика общая для любой задачи.
pass_rule: "Пройдено, если выполнены все признаки части А, на все критичные вопросы части Б ответ «да» и среди некритичных «нет» не больше двух. Суммы баллов нет. Иначе не пройдено: в доработку идёт каждый признак с «нет»; что дополнить — в сообщении проверки (часть А) и в поле no_means (часть Б)."
answer_format: "Критик отвечает на каждый вопрос части Б записью {id, answer: да|нет, where, why}. where — файл и место, why — одна строка. Ответа «не знаю» нет: нечего проверить — значит «нет». Исключение — условный вопрос, который начинается со слова «Если»: когда условия нет, ответ «да», а в why — «условия нет» и номера просмотренных записей. Часть А критик не повторяет: её результат даёт CLI."
how_to_read: "step — шаг, к которому признак уже должен выполняться. На шаге 6 проверяются все признаки, кроме признаков шага 7: их проверяет CLI при выпуске. Файлы — в корне проекта; outputs/ — документы для чтения. Часть А — одна проверка кодом по полям, часть Б — суждение критика."

part_a:
  - id: "А-1"
    step: "6"
    file: [frame.yaml, plan.yaml, gaps.yaml, options.yaml, promises.yaml, verification.yaml]
    rule: "Все шесть файлов есть в корне проекта и читаются."
    source: "Правило «Методика держится на полях выхода»"
    cli_check: required_files_present
  - id: "А-2"
    step: "1"
    file: [frame.yaml, journal.jsonl]
    rule: "В frame.yaml непусты decision, decision_space (не меньше двух значений), deadline, research_question, recipient, constraints, data, region, success_criteria, out_of_scope; у каждого поля, кроме decision_space и version, есть origin; в журнале событие отвеченного В1 хранит frame."
    source: "С-1, рамка и план: событие В1 хранит все поля рамки и откуда каждое"
    cli_check: frame_complete
  - id: "А-3"
    step: "6"
    file: [state.yaml, journal.jsonl]
    rule: "В state.yaml статус ворот до текущего шага (к шагу 6 — В1…В4) соответствует режиму на момент ворот — mode из события ворот в журнале: В1 и В4 — «отвечено»; В2 и В3 — «отвечено» в пилоте и «пройдены автоматически» или «отвечено» в автопилоте. Статуса «впереди» у пройденных ворот нет."
    source: "С-1, прозрачность: события ворот; С-13, прогон а: события ворот соответствуют режиму"
    cli_check: gates_marked
  - id: "А-4"
    step: "4"
    file: [journal.jsonl]
    rule: "В журнале есть событие ворот В1 с answered_at и questions не больше 5 и событие ворот В4 с answered_at."
    source: "С-1, рамка и план: на В1 не больше 5 вопросов; С-1, прозрачность: события ворот В1 и В4"
    cli_check: gate_events_b1_b4
  - id: "А-5"
    step: "3"
    file: [plan.yaml]
    rule: "В plan.yaml непуст estimate (usd или minutes) и ни у одного вопроса нет статуса «открыт»."
    source: "Правило «От решения к вопросам»; С-1, рамка и план"
    cli_check: plan_complete
  - id: "А-6"
    step: "3"
    file: [plan.yaml, claims.yaml]
    rule: "У каждого вопроса plan.yaml со статусом «закрыт» есть хотя бы одно утверждение в claims.yaml, у которого plan_question равен id вопроса."
    source: "Правило «От решения к вопросам»"
    cli_check: plan_questions_have_claims
  - id: "А-7"
    step: "3"
    file: [gaps.yaml]
    rule: "В metric_coverage есть все пять значений kind: «охват», «конверсия», «удержание и отток», «выручка и затраты», «качество продукта»; в каждой записи ровно одно из claims, gap, not_relevant; утверждения в claims — типа «факт» или «прогноз»."
    source: "С-1, картина: показатели, нужные для решения, названы в пробелах; правило «Честные пробелы»"
    cli_check: metric_coverage_complete
  - id: "А-8"
    step: "3"
    file: [outputs/situation.md, claims.yaml]
    rule: "В разделе «Известно» файла outputs/situation.md каждый пункт списка содержит номер существующего утверждения У-n."
    source: "С-1, картина: каждый пункт «известно» ссылается на номера утверждений"
    cli_check: known_items_have_claims
  - id: "А-9"
    step: "3"
    file: [outputs/situation.md, claims.yaml]
    rule: "Каждая пара У-n и У-m из раздела «Где источники спорят» записана в claims.yaml полем dispute у одного из двух утверждений."
    source: "С-1, картина: «где источники спорят» перечисляет пары утверждений; правило «Источники: независимость, вид и расхождения»"
    cli_check: disputes_recorded
  - id: "А-10"
    step: "5"
    file: [outputs/comms-strategy.md, claims.yaml]
    rule: "В comms-strategy.md каждое ключевое сообщение содержит номер существующего утверждения У-n типа «факт» — его подтверждение, и у каждого канала в разделе роли каналов роль непуста."
    source: "С-1, стратегии: ключевое сообщение подтверждено утверждением, у каждого канала — роль"
    cli_check: messages_confirmed_channels_roled
  - id: "А-11"
    step: "3"
    file: [gaps.yaml]
    rule: "У каждого пробела с affects_choice: true и у каждого пробела с close_via «материал руководителя» в searched не меньше двух записей с разными query и непустой date."
    source: "Правило «Честные пробелы»: что искали, прежде чем объявить пробел"
    cli_check: gaps_searched_twice
  - id: "А-12"
    step: "4"
    file: [gaps.yaml, options.yaml]
    rule: "У каждого пробела с affects_choice: true и статусом «открыт» непуст affects_options, и все его номера Вар-n есть в options.yaml."
    source: "С-1, картина: отметка «влияет ли на выбор»; ворота В4: пробелы, которые могут изменить выбор"
    cli_check: gaps_link_options
  - id: "А-13"
    step: "5"
    file: [options.yaml]
    rule: "В options.yaml заполнен chosen, и это один из options[].id."
    source: "Пре-мортем строится для варианта, выбранного на В4"
    cli_check: chosen_set
  - id: "А-14"
    step: "5"
    file: [claims.yaml, verification.yaml, gaps.yaml]
    rule: "Каждая гипотеза в claims.yaml со статусом «действует» названа в rows[].hypothesis или premortem[].claim файла verification.yaml либо в gaps[].hypothesis файла gaps.yaml."
    source: "С-1, утверждения: у каждой гипотезы — строка плана проверки или пробел"
    cli_check: hypotheses_have_rows
  - id: "А-15"
    step: "5"
    file: [options.yaml, verification.yaml]
    rule: "Для каждой записи recommendation.change_mind в options.yaml есть строка rows[] в verification.yaml, у которой from_change_mind равен номеру этой записи (с 1), а change_mind.threshold совпадает с threshold записи без учёта регистра и лишних пробелов."
    source: "С-1, стратегии: у каждого «передумаю, если» есть показатель и порог"
    cli_check: change_mind_in_plan
  - id: "А-16"
    step: "5"
    file: [verification.yaml]
    rule: "В premortem ровно три записи с тремя разными row; row каждой есть среди rows[].id, у этой строки kind: защитный, claim — гипотеза."
    source: "Правило «Пре-мортем выбранного варианта»; С-1, стратегии: причины попали в план проверки защитными показателями"
    cli_check: premortem_defensive
  - id: "А-17"
    step: "5"
    file: [verification.yaml]
    rule: "undesired_effects не пуст, и row каждой записи есть среди rows[].id."
    source: "С-1, стратегии: в плане проверки есть нежелательные последствия"
    cli_check: undesired_effects_present
  - id: "А-18"
    step: "5"
    file: [outputs/product-strategy.md, outputs/comms-strategy.md]
    rule: "В product-strategy.md непусты разделы: аудитория и её задача, альтернативы, направление, осознанные отказы, польза–затраты–доходы. В comms-strategy.md непусты: аудитория и ситуация, барьер, ключевые сообщения, роль каналов."
    source: "С-1, стратегии: заполнены разделы продуктовой и коммуникационной стратегий"
    cli_check: strategy_sections_filled
  - id: "А-19"
    step: "5"
    file: [outputs/comms-strategy.md, promises.yaml]
    rule: "В comms-strategy.md есть хотя бы одна метка [О-n], и каждая метка — существующий promises[].id."
    source: "Правило «Коммуникационная стратегия и таблица обещаний»; С-1, стратегии: каждое обещание есть в таблице"
    cli_check: promise_labels_resolve
  - id: "А-20"
    step: "7"
    file: [outputs/comms-strategy.md, outputs/one-pager.md, promises.yaml]
    rule: "Ни одна метка [О-n] в текстах для аудитории — comms-strategy.md и one-pager.md — не относится к обещанию со статусом «не подтверждено»."
    source: "Правило «Коммуникационная стратегия и таблица обещаний»: неподтверждённое обещание в выпуск не идёт"
    cli_check: unconfirmed_promise_not_released
  - id: "А-21"
    step: "6"
    file: [outputs/*.md]
    rule: "Каждый номер И-n, У-n, П-n, ВП-n, Вар-n, ПП-n и О-n в outputs/*.md написан русскими буквами и есть в своём файле проекта."
    source: "С-1, картина и варианты: ссылки ведут на существующие записи"
    cli_check: document_refs_resolve
  - id: "А-22"
    step: "6"
    file: [outputs/*.md, frame.yaml, sources/]
    rule: "Слова из списка предметной области по умолчанию встречаются в outputs/*.md только если есть в запросе, рамке или снимках."
    source: "С-11: на новой задаче в документах нет слов чужой области"
    cli_check: domain_words_grounded
  - id: "А-23"
    step: "6"
    file: [claims.yaml, sources.yaml, state.yaml]
    rule: "Проверка проекта (check_project) не возвращает ошибок: типы утверждений, цитаты фактов, поля источника, прогноз с диапазоном, гипотеза со способом проверки, поля всех файлов по схемам (не меньше четырёх вариантов, двух возражений на вариант, сравнение по пяти критериям, у строки плана проверки показатель, база, срок и владелец)."
    source: "С-1, утверждения, варианты и стратегии: поля и связи, которые проверяет схема"
    cli_check: project_check_clean
  - id: "А-24"
    step: "5"
    file: [verification.yaml, journal.jsonl]
    rule: "Если у причины premortem hits_choice: true, в журнале после события ворот В4 есть действие «внеплановая остановка», в message которого стоит номер этой причины: ПП-n её строки или У-n её утверждения."
    source: "Правило «Пре-мортем выбранного варианта»; С-1, стратегии: если причина била по выбору, есть внеплановая остановка"
    cli_check: premortem_stop_recorded

part_b:
  - id: "Б-1"
    step: "2а"
    question: "Каждая ветка каждого вопроса плана меняет выбор или действие, а не только пояснение?"
    where: ["plan.yaml (questions[].branches)", "outputs/plan.md"]
    no_means: "Вопрос без разных действий перенести в excluded с причиной или переписать ветки так, чтобы каждая вела к своему действию."
    source: "С-1, рамка и план: у каждого вопроса записано, какой ответ что меняет; правило «От решения к вопросам»"
    critical: true
  - id: "Б-2"
    step: "4"
    question: "Все активные варианты различаются аудиторией, ценностью или моделью дохода, и ни одна пара не отличается лишь масштабом, сроком или бюджетом того же самого?"
    where: ["options.yaml (options[].differs, kind)", "outputs/options.md"]
    no_means: "Близнеца заменить вариантом по другой оси или слить с ближайшим; в differs назвать ось и показать, чем значения различаются."
    source: "С-1, варианты: у каждого указано, чем он отличается от ближайшего; правило «Варианты по заранее заданным осям»"
    critical: true
  - id: "Б-3"
    step: "3"
    question: "Для каждого пробела с влиянием на выбор и каждого пробела, который предлагается закрыть у руководителя (close_via «материал руководителя» или how_to_close называет руководителя): запросы в searched называют сам показатель или предмет пробела; в реестре источников есть хотя бы два И-n разных видов, где этот предмет искали; а если предмета нет в снимке первоисточника — причина записана в пробеле?"
    where: ["gaps.yaml (gaps[].searched, how_to_close, close_via)", "sources.yaml (виды источников)", "sources/", "outputs/situation.md"]
    no_means: "Сначала проверить открытые источники: первоисточник, другого издателя, регулятора; результат записать в searched. В how_to_close открытый путь стоит первым; к руководителю — только когда открытого пути нет."
    source: "С-1, картина: у каждого пробела способ закрыть; правило «Честные пробелы»"
    critical: true
  - id: "Б-4"
    step: "4"
    question: "Отвечает ли recommendation.answer на strongest_objection по существу: называет довод, факт или условие, которое снимает возражение или превращает его в change_mind, а не обходит его?"
    where: ["options.yaml (recommendation, options[].objections)", "outputs/options.md"]
    no_means: "Выбрать сильнейшее возражение заново, как противник рекомендации; ответить фактом или условием, либо добавить его в change_mind с показателем и порогом."
    source: "С-1, варианты: рекомендация отвечает на сильнейшее возражение против себя; правило «Возражения с основанием»"
    critical: true
  - id: "Б-5"
    step: "4"
    question: "Возьмите первые три факта из recommendation.claims (все, если их меньше): подтверждает ли цитата каждого утверждение по смыслу, без добавленных «только», «все», «большинство», числа или условия?"
    where: ["options.yaml (recommendation.claims)", "claims.yaml (quotes)", "sources/"]
    no_means: "Переписать утверждение точно по цитате или найти цитату, которая его подтверждает. Рекомендацию не держать на утверждении, которого цитата не подтверждает."
    source: "С-1, утверждения: у факта цитата, найденная в снимке; правило «Источники: независимость, вид и расхождения»"
    critical: true
  - id: "Б-6"
    step: "5"
    question: "Если в рекомендации или сообщениях есть числа о клиентах, рынке и результатах или обещания эффекта, у которых все цитаты имеют self_reported: true, — поданы ли они как заявление компании («по данным компании»), а не как факт или свойство продукта?"
    where: ["claims.yaml (quotes[].self_reported)", "options.yaml (recommendation)", "outputs/comms-strategy.md"]
    no_means: "Добавить «по данным компании» или найти независимый источник. Рекомендацию на заявлении о результате не держать."
    source: "Правило «Источники: независимость, вид и расхождения»: флаг «о себе»; правило «Коммуникационная стратегия и таблица обещаний»"
    critical: true
  - id: "Б-7"
    step: "5"
    question: "Каждая обещающая фраза в текстах для аудитории (результат, свойство, срок, условие) помечена [О-n]?"
    where: ["outputs/comms-strategy.md", "promises.yaml"]
    no_means: "Выписать обещание в promises.yaml, получить номер и поставить метку. Обещание, которое подтвердить нечем, из текста убрать."
    source: "Правило «Коммуникационная стратегия и таблица обещаний»; С-1, стратегии: каждое обещание есть в таблице"
    critical: true
  - id: "Б-8"
    step: "5"
    question: "Лежат ли все обещания внутри направления продуктовой стратегии, а не в её осознанных отказах?"
    where: ["promises.yaml (text, capability)", "outputs/product-strategy.md (осознанные отказы)", "outputs/comms-strategy.md"]
    no_means: "Обещание, касающееся отказа, убрать из сообщений или пересмотреть отказ с причиной."
    source: "С-1, стратегии: ни одно обещание не касается того, что продуктовая стратегия отнесла к отказам"
    critical: true
  - id: "Б-9"
    step: "5"
    question: "Ссылается ли каждое ключевое сообщение на конкретный пункт продуктовой стратегии — аудиторию, задачу или направление, — а не общими словами?"
    where: ["outputs/comms-strategy.md", "outputs/product-strategy.md"]
    no_means: "Для сообщения без привязки назвать аудиторию, задачу или направление или убрать сообщение."
    source: "С-1, стратегии: каждое ключевое сообщение ссылается на аудиторию, задачу или направление"
    critical: false
  - id: "Б-10"
    step: "3"
    question: "Для каждого показателя перечня причина not_relevant объясняет, почему решение не зависит от него именно в этой задаче, а утверждения в claims действительно о значении этого показателя для этого продукта?"
    where: ["gaps.yaml (metric_coverage)", "claims.yaml", "outputs/situation.md"]
    no_means: "Отписку заменить причиной по существу задачи либо перевести показатель в пробел. Утверждение о соседней величине убрать из записи."
    source: "С-1, картина: показатели, нужные для решения, названы в пробелах; правило «Честные пробелы»"
    critical: true
  - id: "Б-11"
    step: "5"
    question: "Верно ли отмечено hits_choice: ни одна причина с hits_choice: false не опровергает main_assumption выбранного варианта и не повторяет возражение к нему с В4?"
    where: ["verification.yaml (premortem)", "options.yaml (options[].main_assumption, objections, chosen)", "journal.jsonl"]
    no_means: "Причину, бьющую по выбору, отметить hits_choice: true и записать внеплановую остановку: показать причину и допущение, спросить, пересматривать ли выбор. Выбор самостоятельно не менять."
    source: "Правило «Пре-мортем выбранного варианта»; С-1, стратегии: если причина била по выбору, есть внеплановая остановка"
    critical: true
  - id: "Б-12"
    step: "5"
    question: "У каждого осознанного отказа продуктовой стратегии названа конкретная потеря (что именно не получим) и наблюдаемое условие возврата — показатель или событие?"
    where: ["outputs/product-strategy.md"]
    no_means: "К каждому отказу дописать потерю и условие возврата или убрать отказ."
    source: "Правило «Продуктовая стратегия: диагноз, принцип, действия и отказы с ценой»"
    critical: false
  - id: "Б-13"
    step: "5"
    question: "Порог каждого показателя плана проверки опирается на утверждение, аналог или базу из baseline, а если базы нет — baseline ссылается на пробел П-n и needed_n не указан?"
