# Рубрика гайда интервью. Часть А исполняет `strateg guide check`, часть Б — критик или агент.
# Разбор консервативный: явный признак — ошибка, сомнительный — предупреждение. Ошибок нет — гайд проходит
# часть А (код 0); предупреждения остаются на совести автора гайда и читающего. Регулярные выражения
# сверяются с текстом вопроса в нижнем регистре, «ё» заменена на «е». Метод — в карточке interviews.
pass_rule: "Часть А пройдена, если ошибок нет; предупреждения называются в выводе и не блокируют. Часть Б — суждения: на каждый вопрос отвечают «да» или «нет» с номером вопроса гайда, «нет» — повод переписать вопрос."
min_questions: 8
max_questions: 12
sections: ["Цель", "Кого спрашиваем", "Вопросы", "Что слушаем", "Чего не спрашиваем"]
open_words: '(?<![\w-])(?:что|как|какой|какая|какое|какие|каких|каким|когда|где|куда|откуда|почему|зачем|сколько|кто|кого|кому|чем|чего|расскаж\w*|опиш\w*|покаж\w*|вспомн\w*|назов\w*|перечисл\w*|объясн\w*|поделит\w*)(?![\w-])'
continue_words: '(?:,|—|–|-)\s*(?:(?:и|а|и\s+потом|а\s+потом|если\s+да|если\s+нет)\s*,?\s+(?:что|как|почему|зачем|сколько|чем|расскаж\w*|опиш\w*|покаж\w*)|расскаж\w*|опиш\w*|поясн\w*|покаж\w*)(?![\w-])\s*\S'

part_a:
  - id: "Г-1"
    check: question_count
    rule: "В разделе «Вопросы» от 8 до 12 вопросов: меньше не хватает на случай и альтернативу, больше интервью не успевают."
    source: "карточка interviews"
  - id: "Г-2"
    check: future
    reason: "вопрос о будущем или о том, что человек сделал бы"
    rule: "Нет вопроса о будущем или условном поведении («будете ли», «купили бы», «если бы», «хотели бы»): обещания о будущем ничего не стоят, спрашивают о том, что было."
    source: "карточка interviews"
    patterns:
      - '\b(?:будете|будешь|будем|будут|буду)\b'
      - '\b(?:купил\w*|покупал\w*|плат\w*|заплат\w*|пользовал\w*|рекомендов\w*|стал\w*|хотел\w*|захотел\w*|согласил\w*|выбрал\w*|попробовал\w*|подписал\w*|установил\w*|использовал\w*|перешл\w*|сделал\w*|предпочл\w*|предпочитал\w*)\s+бы\b'
      - '\bесли\s+бы\b'
      - '\b(?:вы|вам|я|мы)\s+бы\b'
      - '\bбы\s+(?:вы|ты)\b'
      - '\bсколько\s+бы\b'
      - '\bбудет\s+ли\b'
      - '\b(?:порекомендуете|воспользуетесь|перейдете|выберете|установите|подпишетесь|начнете|станете|решитесь|скачаете|оформите|пригласите|отдадите|предпочтете|согласитесь|рискнете)\s+ли\b'
      - '\b(?:готов|готова|готовы)\s+ли\b'
      - '\b(?:собираетесь|намерены|захотите|сможете|попробуете|купите|заплатите)\b'
      - '\bв\s+(?:будущем|ближайшем|следующем)\b'
      - '\bвпредь\b'
    weak:
      - '\bв\s+(?:следующий\s+раз|дальнейшем)\b'
      - '\bпланируете\b'
      - '\bбы\b'
      - '\bбудет\b'
  - id: "Г-3"
    check: leading
    reason: "наводящий вопрос: ответ подсказан в самом вопросе"
    rule: "Нет наводящих вопросов («не правда ли», «согласитесь», «разве не»): вопрос не содержит ожидаемого ответа."
    source: "карточка interviews"
    patterns:
      - 'не\s+правда\s+ли'
      - '\bсогласитесь\b'
      - '\bразве\s+не\b'
      - 'не\s+так\s+ли'
      - 'не\s+находите'
      - 'не\s+кажется\s+ли'
      - '\bне\s+(?:считаете|думаете|полагаете|согласны|замечали)\s+ли\b'
      - '\bвам\s+не\s+кажется\b'
      - '^\W*наверняка\b'
      - '\b(?:вы|вам|вас)\s+(?:ведь|же)\b'
    weak:
      - '\bнаверняка\b'
      - '\bведь\b'
      - '\bнеужели\b'
      - '\bочевидно\b'
      - '\bконечно\b'
      - '\bправда\s*,?\s+что\b'
  - id: "Г-4"
    check: closed
    reason: "закрытый вопрос «да» или «нет» без продолжения"
    rule: "Нет закрытых вопросов «да» или «нет» без продолжения: после такого вопроса стоит «если да — расскажите, как было»."
    source: "карточка interviews"
    patterns:
      - '^\W*(?:был\w*|есть|бывает|бывало|случалось|приходилось|пользуетесь|пользовались|делали|пробовали|знаете|слышали|помните|думали|хотели|рассматривали|искали|платили|покупали|нравится|устраивает|подходит|удобно|интересно|нужно|важно|хватает)\s+ли\b'
      - '^\W*(?:вы|вам|вас|у\s+вас)\s+\w+\s+ли\b'
      - '^\W*\w+\s+ли\b'
      - '^\W*(?:вы|вам|вас)\s+(?:когда-(?:нибудь|либо|то)|хоть\s+раз|ни\s+разу)\s+\w+'
      - '\bда\s*(?:/|или)\s*нет\b'
    weak:
      - '\bли\b'
      - '^\W*(?:вы|вам)\s+(?!.*\bили\b)[^?]*\?\W*$'
  - id: "Г-5"
    check: pitch
    reason: "в вопросе питч продукта или выдуманная ситуация"
    rule: "В вопросах нет питча: названия продукта, его функции или цены и просьбы представить его («наш сервис», «представьте, что»)."
    source: "карточка interviews"
    patterns:
      - '\bнаш\w*\s+(?:сервис|продукт|приложени|решени|услуг|подписк|функци|платформ|предложени|систем|иде)\w*'
      - '\bмы\s+(?:запускаем|запустим|предлагаем|предложим|разрабатываем|делаем|создаем|хотим\s+сделать|планируем)\b'
      - '\b(?:представьте|допустим|предположим)\b'
      - '\bнаш\w*\s+нов\w+\s+(?:сервис|продукт|приложени|функци|услуг|подписк)\w*'
      - '\b(?:такой|такого|такое|такая|таким|подобн\w+)\s+(?:сервис|продукт|приложени|функци|услуг|подписк)\w*'
      - '\bкак\s+вам\s+иде\w*'
    weak:
      - '\bнов(?:ый|ая|ое|ую|ым)\s+(?:сервис|продукт|приложени|функци|услуг|подписк)\w*'
      - '(?:сервис|приложени\w*|продукт|платформ\w*|бот)\s+[«"“]'
      - '\d[\d\s]*(?:₽|руб)\w*'
  - id: "Г-6"
    check: opinion
    reason: "вопрос о мнении или оценке, а не о случае"
    rule: "Вопросов о мнении («как вы думаете», «вам нравится», «оцените») нет: мнение дёшево, случай — доказательство."
    source: "карточка interviews"
    weak:
      - '\bкак\s+(?:вы\s+)?(?:думаете|считаете|относитесь)\b'
      - '\bпо\s+вашему\b'
      - '\bна\s+ваш\s+взгляд\b'
      - '\bваше\s+мнение\b'
      - '\b(?:нравится|нравилось)\b'
      - '\bкак\s+вам\s+(?:кажется|нравится)\b'
      - '\bчто\s+вы\s+(?:думаете|считаете)\b'
      - '\bнасколько\s+(?:вам\s+)?(?:удобно|важно|полезно|интересно)\b'
      - '\bоцените\b'
      - '\bне\s+хватает\b'
  - id: "Г-7"
    check: past_anchor
    reason: "ни один вопрос не привязан к последнему случаю"
    rule: "Хотя бы один вопрос просит рассказать о последнем случае («в последний раз», «в прошлый раз», «недавно»)."
    source: "карточка interviews"
    patterns:
      - 'последн\w*\s+раз'
      - 'в\s+прошлый\s+раз'
      - 'в\s+тот\s+раз'
      - 'последн\w+\s+(?:случа|ситуаци)'
      - '\bнедавн\w+'
      - '\bвчера\b'
      - 'на\s+прошлой\s+неделе'
      - 'в\s+тот\s+(?:день|момент)'
  - id: "Г-8"
    check: sections
    reason: "в гайде нет раздела"
    rule: "В гайде есть разделы «Цель», «Кого спрашиваем», «Вопросы», «Что слушаем», «Чего не спрашиваем»."
    source: "шаблон interview-guide"
  - id: "Г-9"
    check: double
    reason: "в одном пункте несколько вопросов"
    rule: "В одном пункте не больше двух вопросительных предложений: человек отвечает на последний."
    source: "карточка interviews"

part_b:
  - id: "Г-Б1"
    question: "Первый вопрос просит рассказать о последнем конкретном случае, а не о привычках вообще или о мнении?"
    no_means: "Начните с «Расскажите о последнем разе, когда…» и держитесь этого случая до конца."
    source: "карточка interviews"
  - id: "Г-Б2"
    question: "Каждый вопрос спрашивает о том, что человек делал, сколько это стоило и что вышло, а не о том, что он думает и сделал бы?"
    no_means: "Перепишите вопрос о мнении в вопрос о случае: «что вы сделали, когда…»."
    source: "карточка interviews"
  - id: "Г-Б3"
    question: "Есть вопрос о текущей альтернативе: чем человек решал задачу, когда нашего решения нет, и почему именно этим?"
    no_means: "Добавьте вопрос об альтернативе, в том числе «ничего не делал»."
    source: "карточка interviews"
  - id: "Г-Б4"
    question: "Есть вопрос о том, что человек уже вложил в решение: время, деньги, усилия, обходные пути?"
    no_means: "Добавьте вопрос «сколько это стоило и сколько времени заняло в тот раз»."
    source: "карточка interviews"
  - id: "Г-Б5"
    question: "В разделе «Что слушаем» названы сигналы-факты (случаи, траты, обходные пути, повторы), а не слова одобрения?"
    no_means: "Замените «понравится ли» на наблюдаемое: что делал, чем платил, к чему возвращался."
    source: "карточка interviews"
  - id: "Г-Б6"
    question: "Раздел «Кого спрашиваем» описывает ситуацию людей (кто, когда сталкивается, что использует сейчас) и откуда она взята, а не только возраст и должность?"
    no_means: "Опишите ситуацию и источник: рамка, картина ситуации, материал человека."
    source: "карточка interviews"
  - id: "Г-Б7"
    question: "В вопросах нет названия продукта, его функций и цены?"
    no_means: "Уберите название и описание продукта из вопроса: спросите, как человек решает задачу сейчас."
    source: "карточка interviews"
