# Бюджет проекта по умолчанию (ADR-0010). Его получает каждый новый проект; `strateg budget set` меняет
# бюджет одного проекта. Остановка наступает по тому, что кончится раньше: деньги или время работы агента.
#
# Числа выбраны по замеру сквозного прогона от 8 ноября 2026 с субагентами: до выпуска без повторной проверки
# полноты он стоил $5,23 и занял около 25 минут работы (28 минут по часам); к шестому шагу из восьми от прежних
# $5 оставалось $0,69. Полному пути нужны ещё повторная проверка полноты критиком (около $0,23 за вызов) и
# поиск по пробелам (исследователь, около $0,13 за вызов), вместе около $1, и запас на материалы человека,
# повторы и доработку. Время прежнее: ожидание ответов человека в работу не входит.
budget:
  usd: 8
  minutes: 60
  # С этой доли лимита строка статуса предупреждает (на 80 % агент не останавливается).
  warn_share: 0.8
  # Резерв на выпуск с пометкой о неполноте: `strateg budget check --action выпуск` в нём не отказывает.
  release_reserve:
    usd: 0.5
    minutes: 5

# Цена шага, когда у проекта нет истории: `strateg budget check --next` берёт отсюда оценку следующего шага
# (деньги и минуты работы) и называет её «оценкой по таблице». Есть завершённые шаги проекта — берётся медиана
# по ним, таблица не нужна. Числа — доли замера сквозного прогона от 8 ноября 2026 (до выпуска $5,23 и около
# 25 минут); шаг 8 — по прогону пересмотра. Это грубая оценка, а не прогноз: меняйте под свою модель и задачу.
step_estimate:
  "1": {usd: 0.5, minutes: 2}
  "2а": {usd: 0.4, minutes: 2}
  "2б": {usd: 1.6, minutes: 8}
  "3": {usd: 0.4, minutes: 3}
  "4": {usd: 0.9, minutes: 4}
  "5": {usd: 0.7, minutes: 3}
  "6": {usd: 0.3, minutes: 2}
  "7": {usd: 0.6, minutes: 3}
  "8": {usd: 0.8, minutes: 3}

# Сопровождение решений после выпуска (ADR-0016): по этим числам `strateg due` решает, что назвать «сейчас».
# Подбирались по смыслу задачи, не по замеру: у цен и тарифов конкурентов срок жизни — месяцы, у обязательств
# команды — дни. Меняйте под свой рынок.
follow_up:
  # Источник факта, на который опирается решение, старше этого срока по дате обращения (в днях) — основание
  # устарело: страницу с ценой, тарифом или условиями полугодовой давности пора перепроверить.
  source_max_age_days: 180
  # Обязательство со сроком в пределах этого числа дней (и просроченное) попадает в ответ «что решать сейчас»:
  # за неделю можно успеть выполнить, за месяц — ещё рано отвлекать.
  commitments_window_days: 7
