# Бюджет проекта по умолчанию (ADR-0010). Его получает каждый новый проект; `strateg budget set` меняет
# бюджет одного проекта. Остановка наступает по тому, что кончится раньше: деньги или время работы агента.
#
# Числа выбраны по замеру двух прогонов учебного кейса: 13–15 минут работы и около 1,7 доллара каждый.
# Запас — примерно втрое по деньгам и вчетверо по времени: материалы человека, повторы и доработка дольше
# учебного кейса, а токенайзер моделей 4.7 и новее даёт на тот же текст больше токенов.
budget:
  usd: 5
  minutes: 60
  # С этой доли лимита строка статуса предупреждает (на 80 % агент не останавливается).
  warn_share: 0.8
  # Резерв на выпуск с пометкой о неполноте: `strateg budget check --action выпуск` в нём не отказывает.
  release_reserve:
    usd: 0.5
    minutes: 5
