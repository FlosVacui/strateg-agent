# Маршрут ролей (ADR-0008): уровень модели, effort и условие повышения. Единственный источник выбора
# модели для ролей; основная модель — та, что выбрана в среде, таблица её не меняет.
# Ключи ролей совпадают с именами субагентов. Читает `strateg route`: модель и effort роли с учётом
# профиля проекта, повышение по условию (не больше `times` раз на роль и шаг), запись выбора в журнал.
schema_version: 1

# Уровни отображаются на псевдонимы моделей Claude Code.
levels: {сильная: opus, средняя: sonnet, дешёвая: haiku}

roles:
  # depth — число источников на вопрос плана.
  researcher: {level: средняя, effort: medium, depth: 3}
  critic: {level: средняя, effort: high, upgrade: {when: "проверка полноты не пройдена после доработки", to: сильная, times: 1}}
  respondent: {level: средняя, effort: medium}

# Профиль меняет выбор только там, где написано; «обычный» — таблица выше без изменений.
profiles:
  экономнее: {researcher: {depth: 2}}
  глубже: {researcher: {depth: 5}, critic: {level: сильная}}
