# Поля пары — как у `strateg claim pairs`: id, type (тип, который записал агент), text, period, region, quotes.
# expected.verdict — верный вердикт, expected.type — верный тип: тип верен, если он равен type.
# group — для долей выборки: подтверждает, не подтверждает, частично (тип верен) и «неверный тип».
# trap — ловушка пары, если она есть. Доли и ловушки сверяет tests/test_eval_classifier.py.
