schema_version: 1
options:
  - id: Вар-1
    title: Оставить как есть
    kind: оставить как есть
    differs:
      axis: ценность
      from: Вар-3
      how: защита остаётся отдельной подпиской без объяснения ценности
    main_assumption: Абоненты находят подписку сами
    inaction_cost: Рост подключений остаётся ниже прогноза аналога
    objections:
      - hits_assumption: Абоненты находят подписку сами
        drops_if: большинство подключивших защиту пришло из рекламы, а не из поиска
        basis: гипотеза
      - hits_assumption: Подписка не требует объяснения
        drops_if: семьи с пожилыми родителями называют непонятную ценность главной причиной отказа
        basis: У-3
    comparison:
      effect:
        why_empty: нет ни базы, ни аналога для диапазона
      cost:
        text: Затрат нет
      risk:
        text: Отток к конкурентам с более понятным предложением
      first_signal:
        why_empty: без изменений сигнала нет
      reversibility:
        text: Решение можно пересмотреть в любой момент
        what: вернуться к любому из других вариантов
        time: сразу
        price: без затрат
  - id: Вар-2
    title: Продавать защиту отдельной подпиской семьям с пожилыми родителями
    kind: активный
    differs:
      axis: аудитория
      from: Вар-3
      how: предложение собрано вокруг семьи, а не вокруг всех абонентов
    main_assumption: Семьи с пожилыми родителями готовы платить отдельно
    objections:
      - hits_assumption: Семьи готовы платить отдельно
        drops_if: пробный период почти никто не продлевает
        basis: гипотеза
      - hits_assumption: Семьи составляют заметную часть абонентов
        drops_if: охват аудитории меньше десятой части базы
        basis: У-4
    comparison:
      effect:
        text: Доля абонентов с защитой вырастет до 15–17 %
        forecast: У-4
      cost:
        text: Затраты на отдельное предложение и обучение продаж
      risk:
        text: Подписка не окупится на узкой аудитории
      first_signal:
        text: Первые продления через месяц после запуска
        forecast: У-4
      reversibility:
        text: Предложение можно закрыть
        what: снять предложение из продажи
        time: две недели
        price: затраты на уведомление абонентов
  - id: Вар-3
    title: Включить защиту в тарифы
    kind: активный
    differs:
      axis: модель дохода
      from: Вар-2
      how: доход идёт через тариф, а не через отдельный платёж
    main_assumption: Абоненты не откажутся от более дорогого тарифа
    objections:
      - hits_assumption: Абоненты не откажутся от более дорогого тарифа
        drops_if: рост цены тарифа вызывает отток заметнее выручки от защиты
        basis: гипотеза
      - hits_assumption: Защита нужна всем
        drops_if: защитой пользуется меньше четверти абонентов
        basis: У-3
    comparison:
      effect:
        why_empty: нет базы для диапазона по выручке тарифов
      cost:
        text: Пересчёт тарифов и перенастройка биллинга
      risk:
        text: Отток из-за роста цены
      first_signal:
        why_empty: сигнал появится только после смены тарифов
      reversibility:
        text: Откат тарифов трудный
        what: вернуть прежние тарифы
        time: квартал
        price: потеря доверия и затраты на биллинг
  - id: Вар-4
    title: Закрыть направление
    kind: закрыть направление
    differs:
      axis: ценность
      from: Вар-1
      how: услуга снимается с продажи, ресурсы уходят в другие направления
    main_assumption: Защита не даёт заметного дохода
    return_condition: Подключения вырастут втрое без рекламы или появится новая угроза для абонентов
    objections:
      - hits_assumption: Защита не даёт заметного дохода
        drops_if: доход от защиты окупает поддержку с запасом
        basis: У-2
      - hits_assumption: Абоненты не заметят закрытия
        drops_if: заметная часть абонентов с защитой уходит к конкурентам
        basis: гипотеза
    comparison:
      effect:
        why_empty: нет базы для диапазона
      cost:
        text: Затраты на закрытие и уведомление абонентов
      risk:
        text: Потеря абонентов, которым защита нужна
      first_signal:
        why_empty: сигнал приходит после закрытия
      reversibility:
        text: Возврат услуги дорогой
        what: запуск услуги заново
        time: полгода
        price: затраты на новый запуск
recommendation:
  option: Вар-2
  why: Цена подтверждена, а рост подключений ожидается у аудитории, которая видит ценность
  claims:
    - У-2
    - У-4
  strongest_objection: Семьи могут не платить отдельно
  answer: Пробный период и первые продления покажут готовность платить до больших затрат
  change_mind:
    - metric: доля продлений после пробного периода
      threshold: ниже 20 %
      action: перейти к варианту Вар-3
  loses_on: обратимость
chosen: Вар-2
