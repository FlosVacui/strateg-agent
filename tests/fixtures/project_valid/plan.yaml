schema_version: 1
questions:
  - id: ВП-1
    text: Сколько стоит подписка «Защита» в Москве?
    impact: высокое
    branches:
      - if: цена ниже порога, который семьи считают приемлемым
        then: продавать отдельной подпиской
      - if: цена выше этого порога
        then: включить защиту в тарифы
    close_cost:
      usd: 0.1
      minutes: 3
    where: страница тарифов компании
    status: закрыт
  - id: ВП-2
    text: Кто подключает защиту?
    impact: высокое
    branches:
      - if: подключают в основном семьи с пожилыми родителями
        then: строить предложение вокруг семьи
      - if: подключают разные группы, семьи не выделяются
        then: оставить общее предложение
    close_cost:
      usd: 0.8
      minutes: 10
    where: интервью с абонентами, отраслевые обзоры
    status: открыт
  - id: ВП-3
    text: Какая доля абонентов отключает защиту в первый месяц?
    impact: среднее
    branches:
      - if: отключают меньше десятой части
        then: запускать без изменений
      - if: отключают больше трети
        then: сначала доработать первую неделю использования
    close_cost:
      usd: 0
      minutes: 15
    where: выгрузка отключений у владельца продукта
    status: пробел
    gap: П-1
excluded:
  - text: Как называется услуга у конкурентов
    reason: название не меняет ни одно из действий
estimate:
  usd: 2.5
  minutes: 40
