# Заготовленные ответы к main.yaml и holdout.yaml: все пары выборки — одним заданием (batch не задан).
# Дешёвая модель на основной не уверена в У-3, повтор на средней его решает; связка «оставить» на обеих.
schema_version: 2
samples:
  main:
    haiku:
      - cost_usd: 0.001
        text: |-
          У-1 | подтверждает | тип: да | часы совпадают
          У-2 | не подтверждает | тип: да | 3 500, а не 3 000
          У-3 | не уверен | тип: да | неясно, всегда ли бесплатно
          У-4 | подтверждает | тип: нет, прогноз | намерение, а не факт
    sonnet:
      - cost_usd: 0.01
        text: |-
          У-1 | подтверждает | тип: да | часы совпадают
          У-2 | не подтверждает | тип: да | 3 500, а не 3 000
          У-3 | частично | тип: да | только в будни
          У-4 | подтверждает | тип: нет, прогноз | намерение, а не факт
    retry:
      - cost_usd: 0.002
        text: |-
          У-3 | частично | тип: да | только в будни
  holdout:
    haiku:
      - cost_usd: 0.001
        text: |-
          У-101 | подтверждает | тип: да | время то же
          У-102 | не подтверждает | тип: да | прокат платный
          У-103 | частично | тип: да | о марте ничего
    sonnet:
      - cost_usd: 0.01
        text: |-
          У-101 | подтверждает | тип: да | время то же
          У-102 | не подтверждает | тип: да | прокат платный
          У-103 | частично | тип: да | о марте ничего
