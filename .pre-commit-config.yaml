# Только локальные хуки: ничего не скачивается и не собирается при первом коммите.
# Нужны gitleaks и uv в PATH (uv поставит ruff той версии, что записана в uv.lock).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (секреты в индексе)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: sync-skills
        name: копия скиллов совпадает
        entry: uv run python scripts/sync_skills.py --check
        language: system
        pass_filenames: false
