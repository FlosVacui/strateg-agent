name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый запуск для того же PR отменяет предыдущий; запуски на main не отменяются.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Зависимости
        run: uv sync --locked
      - name: Проверка среды
        run: uv run strateg doctor
      - name: Ruff — ошибки
        run: uv run ruff check .
      - name: Ruff — формат
        run: uv run ruff format --check .
      - name: Тесты
        run: uv run pytest -q
      - name: Ссылки в документах
        run: uv run python scripts/check_links.py
      - name: Копия скиллов совпадает
        run: uv run python scripts/sync_skills.py --check

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Репозиторий станет публичным: в истории допустимы только служебные адреса GitHub.
      # Служебный коммит слияния PR пропускается (--no-merges), сами адреса в лог не выводятся.
      - name: Адреса авторов — только служебные GitHub
        shell: bash
        run: |
          bad=$(git log --no-merges --format='%h %ae %ce' | awk '{
            for (i = 2; i <= 3; i++)
              if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print $1; break }
          }')
          if [ -n "$bad" ]; then
            echo "::error::Коммиты с личным адресом автора или коммитера: $(echo $bad)"
            echo "Задайте git config user.email <id>+<логин>@users.noreply.github.com и перепишите эти коммиты."
            exit 1
          fi
          echo "Все адреса в истории служебные."
