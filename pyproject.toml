[project]
name = "strateg"
version = "0.0.1"
description = "«Стратег» — ИИ-агент для руководителя цифрового продукта: от размытого запроса до продуктовой и коммуникационной стратегии"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdown-it-py>=4",
    "openpyxl>=3.1.5",
    "protego>=0.7.0",
    "pydantic>=2.14.3",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "pypdfium2>=5.15.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1",
]

[project.urls]
Repository = "https://github.com/FlosVacui/strateg-agent"

[project.scripts]
strateg = "strateg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strateg"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
